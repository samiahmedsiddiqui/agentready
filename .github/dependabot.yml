version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
