name: wp-env tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  wp-env:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.4' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Install the PHPUnit polyfills
        run: composer install --no-interaction --prefer-dist

      - name: Start wp-env
        run: npx --yes @wordpress/env start

      - name: Run the tests
        run: npx @wordpress/env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" vendor/bin/phpunit -c tests/wp-env/phpunit.xml.dist

      - name: Show the debug log
        if: failure()
        run: npx @wordpress/env run tests-cli cat wp-content/debug.log || true
